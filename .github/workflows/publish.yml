# Publishes this n8n community node package to npm on every version tag push,
# behind a manual approval gate.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── FLOW ──────────────────────────────────────────────────────────────────────
#
#   local:  npm run release   → bump + changelog + commit + tag vX.Y.Z + push
#              │  (tag push triggers this workflow)
#              ▼
#   CI:     stage job   → npm ci + test + npm pack → upload tarball artifact
#              │  (pauses on the protected `npm-release` environment)
#              ▼
#   you:    GitHub → Actions → this run → "Review deployments" → Approve
#              ▼
#   CI:     publish job → npm run release (CI mode) → OIDC publish w/ provenance
#
# The version is decided locally (reviewed, tests seen); shipping to npm is a
# deliberate human approval on GitHub. No long-lived npm token is involved.
#
# ─── PREREQUISITES ─────────────────────────────────────────────────────────────
#
# @n8n/node-cli ≥ 0.23.0 is required (it passes the provenance flag in CI).
# Check with:  npm list @n8n/node-cli
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# 1. Create the protected GitHub Environment that gates publishing:
#      Repo → Settings → Environments → New environment → name it `npm-release`.
#      Add a protection rule: "Required reviewers" → add yourself.
#      (This is what makes the publish job pause for approval.)
#
# 2. Set up npm OIDC Trusted Publishing (no secret needed):
#      npmjs.com → this package → Settings → Trusted Publishers → Add publisher →
#      GitHub Actions, with:
#        Repository owner: michaelwittmann
#        Repository name:  n8n-nodes-xberg-pdf-vlm-extractor
#        Workflow name:    publish.yml
#        Environment:      npm-release      ← must match the environment below
#      Then delete the NPM_TOKEN repo secret — it is no longer used.
#
# See RELEASING.md for the full walkthrough.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# Triggers on tags matching "v*.*.*" (e.g. v0.2.0) — the format
# `@n8n/node-cli release` (release-it) produces by default.

name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # ── Stage: build, test, and pack the tarball. No secrets, no publish. ────────
  stage:
    name: Stage release artifact
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run tests
        run: 'npm test'

      - name: Build
        run: 'npm run build'

      - name: Pack tarball
        # Produces the exact tarball that would be published, so it can be
        # inspected before approval. --dry-run style validation happens here.
        run: 'npm pack'

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 7

  # ── Publish: gated on the protected `npm-release` environment. ───────────────
  # The job pauses here until a required reviewer approves the deployment in the
  # GitHub Actions UI. Only then does it publish to npm via OIDC.
  publish:
    name: Publish to npm
    needs: stage
    runs-on: ubuntu-latest
    environment: npm-release

    permissions:
      # Required to mint an OIDC token for npm Trusted Publishing + provenance.
      id-token: write
      # Least privilege — the workflow never writes to the repo.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          # Required for npm OIDC Trusted Publishing to target the public registry.
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: 'npm ci'

      - name: Release
        # In CI, `n8n-node release` lints, builds, and publishes with provenance
        # (NPM_CONFIG_PROVENANCE=true). Auth is via the OIDC exchange configured
        # as a Trusted Publisher on npm — no NPM_TOKEN needed.
        run: 'npm run release'
